<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1B"/>
      <stop offset="50%" stop-color="#0A1633"/>
      <stop offset="100%" stop-color="#030812"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0066FF"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Primary Letter Gradient (A) -->
    <linearGradient id="letter-a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Secondary Letter Gradient (S) -->
    <linearGradient id="letter-s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Golden Spark Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep High-Tech Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="14"/>

  <!-- Subtle Inner Grid / Reliability Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0066FF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Energy Waveform Pulse Line at base -->
  <path d="M 120 400 L 200 400 L 220 420 L 245 375 L 270 425 L 290 400 L 392 400" 
        fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized Interlocked "AS" Monogram -->
  <!-- "A" Glyph: Sharp, Geometric, Dynamic Apex with Electrical Surge -->
  <g filter="url(#neon-glow)">
    <!-- Left Leg of A -->
    <path d="M 116 356 L 220 120 L 268 120 L 164 356 Z" fill="url(#letter-a-grad)"/>

    <!-- Right Leg of A (Interlaced behind S) -->
    <path d="M 236 120 L 284 120 L 388 356 L 340 356 L 290 240 L 210 240 L 230 196 L 310 196 Z" fill="url(#letter-a-grad)"/>

    <!-- A-Bar Cross Beam with Lightning Spark Notch -->
    <polygon points="176,276 300,276 270,306 162,306" fill="#00F0FF" opacity="0.95"/>
  </g>

  <!-- "S" Glyph: Precision Industrial Sweep -->
  <g filter="url(#neon-glow)">
    <!-- Bold High-Visibility S Path -->
    <path d="M 372 150 
             C 340 120, 276 126, 260 168 
             C 246 204, 280 228, 324 246 
             C 376 268, 404 296, 396 342 
             C 384 402, 306 424, 240 404 
             C 214 396, 192 380, 178 362 
             L 214 330 
             C 230 350, 258 368, 298 370 
             C 336 372, 354 352, 350 330 
             C 344 298, 308 284, 266 264 
             C 220 242, 198 214, 206 172 
             C 218 116, 294 92, 360 106 
             C 384 112, 404 124, 416 138 
             Z" 
          fill="url(#letter-s-grad)" opacity="0.95"/>
  </g>

  <!-- Central Dynamic Reliability Spark / Diamond Star (Golden Apex) -->
  <g transform="translate(252, 118)" filter="url(#soft-glow)">
    <!-- 4-Pointed Precision Star -->
    <path d="M 0 -34 Q 0 0 34 0 Q 0 0 0 34 Q 0 0 -34 0 Q 0 0 0 -34 Z" fill="url(#spark-grad)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Small Electrical Energy Indicator in bottom right -->
  <circle cx="390" cy="390" r="12" fill="#00F0FF" opacity="0.8" filter="url(#neon-glow)"/>
  <circle cx="390" cy="390" r="5" fill="#FFFFFF"/>
</svg>