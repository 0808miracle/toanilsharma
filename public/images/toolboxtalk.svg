<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="tbBgGrad" x1="0" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="tbGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="240" rx="24" fill="url(#tbBgGrad)"/>
  <rect x="2" y="2" width="596" height="236" rx="22" stroke="#27272a" stroke-width="2"/>
  
  <!-- Safety Shield / AI Icon -->
  <g transform="translate(60, 60)">
    <rect width="120" height="120" rx="24" fill="#18181b" stroke="#f59e0b" stroke-width="3"/>
    <!-- Hardhat / Shield contour -->
    <path d="M35 75 C35 45, 85 45, 85 75 Z" fill="url(#tbGoldGrad)"/>
    <path d="M25 75 L95 75 C95 80, 25 80, 25 75 Z" fill="#fbbf24"/>
    <circle cx="60" cy="52" r="5" fill="#ffffff"/>
  </g>
  
  <!-- Text Branding -->
  <text x="210" y="115" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Toolbox<tspan fill="#f59e0b">Talk</tspan><tspan fill="#94a3b8" font-size="28">.co.in</tspan>
  </text>
  <text x="212" y="155" font-family="monospace" font-size="14" font-weight="600" fill="#a1a1aa" letter-spacing="3">
    AI-POWERED SAFETY PLATFORM • OSHA &amp; IS NORMS
  </text>
  
  <!-- AI Status Pill -->
  <rect x="470" y="55" width="80" height="26" rx="13" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="486" y="73" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b">AI SAFETY</text>
</svg>
