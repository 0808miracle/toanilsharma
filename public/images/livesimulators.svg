<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="596" height="236" rx="22" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Grid Accent Lines -->
  <path d="M40 0v240M120 0v240M480 0v240M560 0v240" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  
  <!-- High Tech Wave / Simulator Icon -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <rect width="120" height="120" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Sine Wave / Physics Pulse -->
    <path d="M20 60 Q 35 15, 50 60 T 80 60 T 100 60" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="60" r="6" fill="#38bdf8"/>
    <circle cx="80" cy="60" r="6" fill="#38bdf8"/>
  </g>
  
  <!-- Text Branding -->
  <text x="210" y="115" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Live<tspan fill="#38bdf8">Simulators</tspan>
  </text>
  <text x="212" y="155" font-family="monospace" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">
    INTERACTIVE VIRTUAL LABS • FLOAT64 SOLVER
  </text>
  
  <!-- Live Status Dot -->
  <circle cx="520" cy="70" r="6" fill="#10b981" />
  <circle cx="520" cy="70" r="12" stroke="#10b981" stroke-width="2" opacity="0.4" />
</svg>
